<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Equipo Alfa Buena Maravilla Onda Dinamita Escuadrón Lobo</title>
  <desc id="desc">Banner académico estilo ventana macOS para el proyecto Flutter de Desarrollo de Aplicaciones Móviles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.5" stop-color="#00245A"/>
      <stop offset="1" stop-color="#003C4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#00A7E8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233C" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A1829" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1410" cy="125" r="210" fill="#009D81" opacity="0.10"/>
  <circle cx="180" cy="650" r="260" fill="#00A7E8" opacity="0.07"/>

  <g filter="url(#shadow)">
    <rect x="72" y="58" width="1456" height="604" rx="28" fill="#0B1320" stroke="#2B3A50" stroke-width="2"/>
    <rect x="72" y="58" width="1456" height="72" rx="28" fill="#151F2E"/>
    <rect x="72" y="102" width="1456" height="28" fill="#151F2E"/>
  </g>

  <circle cx="116" cy="94" r="10" fill="#FF5F57"/>
  <circle cx="148" cy="94" r="10" fill="#FEBC2E"/>
  <circle cx="180" cy="94" r="10" fill="#28C840"/>
  <text x="800" y="101" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">alfa-buena-mara — README.md</text>

  <rect x="112" y="168" width="792" height="300" rx="24" fill="url(#panel)" stroke="#1F4663"/>
  <rect x="936" y="168" width="552" height="300" rx="24" fill="url(#panel)" stroke="#1A5D58"/>

  <rect x="112" y="168" width="8" height="300" rx="4" fill="url(#accent)"/>
  <text x="154" y="216" fill="#00E0BD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">EQUIPO ALFA</text>
  <text x="154" y="274" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">BUENA MARAVILLA ONDA</text>
  <text x="154" y="324" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">DINAMITA ESCUADRÓN LOBO</text>
  <text x="154" y="374" fill="#9FD8EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600">Desarrollo de Aplicaciones Móviles · Flutter + Dart</text>

  <rect x="154" y="408" width="158" height="36" rx="18" fill="#009D81"/>
  <text x="233" y="433" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">12 USER STORIES</text>
  <rect x="328" y="408" width="130" height="36" rx="18" fill="#02569B"/>
  <text x="393" y="433" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">FLUTTER</text>
  <rect x="474" y="408" width="116" height="36" rx="18" fill="#181717" stroke="#39485E"/>
  <text x="532" y="433" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">GITHUB</text>

  <text x="974" y="214" fill="#5DE3C7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">DATOS ACADÉMICOS</text>
  <text x="974" y="254" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Universidad Tecnológica de</text>
  <text x="974" y="284" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">San Juan del Río</text>
  <line x1="974" y1="306" x2="1450" y2="306" stroke="#24485A"/>
  <text x="974" y="340" fill="#AFC7D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Ingeniería en Desarrollo de Software Multiplataforma</text>
  <text x="974" y="375" fill="#AFC7D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">4.º Cuatrimestre · Unidad 1</text>
  <text x="974" y="410" fill="#AFC7D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Grupo DSM1SM-25ERS</text>
  <text x="974" y="445" fill="#AFC7D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Docente: Othón Guzmán Docurro</text>

  <rect x="112" y="500" width="1376" height="116" rx="22" fill="#0C1928" stroke="#20364B"/>
  <text x="140" y="535" fill="#73E6D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">INTEGRANTES</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#EAF5FA" font-weight="600">
    <text x="140" y="574">Angel Ariel Escobedo Lugo</text>
    <text x="418" y="574">Julio Cesar Ramírez Vela</text>
    <text x="680" y="574">Sebastián Mendoza Montoya</text>
    <text x="978" y="574">Leonel Hernández Trejo</text>
    <text x="1240" y="574">Kurt Cobain Vazquez Sanchez</text>
